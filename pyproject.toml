[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "houbridge"
version = "0.2.0"
description = "CLI bridge for controlling a running Houdini session."
requires-python = ">=3.11"
dependencies = [
  "platformdirs>=4,<5",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
houbridge = "houbridge.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/houbridge"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
