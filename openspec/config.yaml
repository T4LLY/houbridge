schema: spec-driven

context: |
  Project: Houbridge
  Runtime: Python >=3.11 external CLI plus Houdini's bundled Python for injected scripts.
  Houbridge controls an already-running or locally launched Houdini GUI session through Houdini openport and SideFX hcommand.
  The Houdini-side operation language is raw hou Python. Reusable injected source lives under houbridge/houdini/scripts/ and is dispatched per invocation.
  The top-level feature subsystems are Resource, Output, Session, Hip, Capture, Search, Execution, Task, and History. Shared infrastructure includes configuration, Houdini transport, target coordination, temporary-workspace management, temporary-artifact publication, and low-level search primitives.
  Synchronous Execution is invocation-local. Async Task owns queued/running operational state. Session Action History stores only finalized AI action-recall entries for executions that actually start in Houdini.
  Houbridge persistence is external to the Houdini scene. Global operational state lives below the configured operational root; workspace script-search derived state remains in <cwd>/.houbridge/search.db.
  Resource payload storage is database-complete in <data-dir>/resources.db together with metadata, SHA-256 canonical identities, semantic aliases, and semantic tags. Task state is stored in <data-dir>/tasks.db. Session Action History is stored below <data-dir>/history/<session-key>/history.db.
  Workspace Python scripts live below <cwd>/.houbridge/python. Their files are authoritative; search.db contains derived indexing state. A Python module docstring is the file-level script description used by local script search.
  Live Python/VEX and node search operate on current Houdini state. Live code indexing is transient rather than a persistent workspace index.
  The Houbridge Skill is an authoring contract rather than a runtime subsystem; when it creates reusable scripts below .houbridge/python, it follows the Skill specification.
  All public command payloads pass through one common Output subsystem. Feature modules do not implement their own token thresholds, Resource fallback, or hard-output limiting.
  The configured global Houbridge data directory owns shared tasks.db, shared resources.db, and session-scoped History databases below history/. Exact-Houdini-process coordination locks live in a fixed platform-standard per-user Houbridge coordination directory independent of the configured global data directory. Invocation-local transient execution and recovery files use the Temporary Workspace boundary. Workspace script source and its rebuildable search index remain local to the working directory.

rules:
  specs:
    - Describe observable behavior and explicit architectural invariants.
    - Every requirement must include at least one concrete WHEN/THEN scenario.
    - Command JSON response schemas are specified separately and must not be invented in feature specs.
    - Implement only capabilities and persistence explicitly defined by the current specification set.
  design:
    - Keep feature ownership and dependency direction explicit.
    - Distinguish live Houdini state, workspace-derived search state, global Resource/Task state, session-scoped History state, configuration state, and invocation-local transient state.
    - Construct only the subsystems required by the selected command.
    - Keep Houdini-injected implementation separate from host orchestration.
